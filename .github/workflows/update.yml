name: rebuild fx data
on:
  schedule:
    - cron: '0 6 * * 1-5'      # weekdays 06:00 UTC
  workflow_dispatch:            # or click Run workflow
    inputs:
      external:
        description: 'Fetch external data and rescore it (FX_RUN_EXTERNAL, ~25 min)'
        type: boolean
        default: false
  push:
    paths: ['code/**']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: run pipeline
        id: pipe
        continue-on-error: true
        env:
          # Actions sits on a different network from the dev sandbox. The probe in
          # pipeline.py runs either way and records what resolves from here.
          FX_RUN_EXTERNAL: ${{ inputs.external && '1' || '' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -o pipefail
          python code/pipeline.py 2>&1 | tee /tmp/pipeline.log
      # A FAILING PIPELINE USED TO BE INVISIBLE FROM THE REPO. It ran, died, and
      # skipped the commit step, so the only symptom was data quietly ceasing to
      # update -- which is how 124 consecutive failures went unnoticed for two
      # weeks. Downloading an Actions log needs authentication; a file in the
      # repo does not. On failure the tail is committed so the error is readable
      # by anyone with a clone.
      - name: publish the failure log
        if: steps.pipe.outcome == 'failure'
        run: |
          mkdir -p results
          tail -c 60000 /tmp/pipeline.log > results/ci_last_failure.log
          git config user.name  "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add -f results/ci_last_failure.log
          git commit -m "ci: pipeline failed, capturing the log" || true
          git pull --rebase --autostash || true
          git push || true
          exit 1
      - name: commit refreshed data
        if: steps.pipe.outcome == 'success'
        run: |
          git config user.name  "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add -A app_data.json app_signals.json app_explorer.json app_ui.js results/ \
                     data/px28.csv data/ext.csv data/rates2y.csv data/carry28.csv
          git diff --staged --quiet || git commit -m "auto: refresh $(date -u +%Y-%m-%d)"
          git push
